<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe </title>
    <link rel="icon" href="../assets/heart.png" sizes="64x64">
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    text-decoration: none;

}
@font-face {
    font-family: "Pixel";
    src: url("../fonts/dogica/TTF/dogicapixel.ttf");
}
@font-face {
    font-family: "handwriting";
    src: url("../fonts/Internet\ Friends.ttf");
}
@font-face {
    font-family: "cheese milky";
    src: url("../fonts/cheese_milky/Cheese\ Milky.otf");
}
body{
    background-image: url('../assets/bg-image.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    width: 100vw; 
    border: 6px solid #7a3b41; 
    overflow: hidden;
    color: #dd6e42;
    font-family: "cheese milky";
}
body::before{
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(122, 59, 65, 0.1);
    display: flex;
    justify-content: center;
    align-items: center;
}
.msg {
    height: 95vh;
    width: 95vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: rgba(255,255,255,0.4);
    backdrop-filter: blur(4px);
    border: 3px solid #e8899a;
    border-radius: 64px;
}
h2{
    font-family: "handwriting";
    margin-top: 53px;
    font-size: 93px;
    letter-spacing: 15px;
}

p{
    font-size: 33px;
    letter-spacing: 22px;
    position: absolute;
    bottom: 275px;
}
img{
    height: 30vmin;
    width: 30vmin;
    cursor: pointer;
    position: relative;
    bottom: 37px;

}

a {
    font-family: "cheese milky";
    font-size: 1.1rem;
    letter-spacing: 0.3rem;
    font-weight: bold;
    color: var(--maroon);
    background-color: rgba(241, 235, 208, 0.9);
    padding: 0.5rem 2rem;
    border: 3px solid var(--pink-border);
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.2s ease-in-out;
    box-shadow: 0 4px 10px rgb(0 0 0 / 10%);
    position: relative;
    bottom: 32px;

}
a:hover {
    background-color: #e4bec5;
    transform: scale(1.05);
    box-shadow: 0 6px 15px rgba(229, 107, 111, 0.35);
}
@media (max-width: 768px){
    h2{
        font-size: 3.5rem;
        letter-spacing: 8px;
    }
    p{
        font-size: 22px;
        letter-spacing: 10px;
        padding-top: 6rem;
        bottom: 290px;
    }
    img{
        position: relative;
        bottom: 23px;
    }
    a{
        bottom: 5px;
    }

}

@media (max-width: 480px){
    body{
        overflow: auto;
        min-height: 100vh;
    }
    h2{
        font-size: 2.2rem;
        letter-spacing: 4px;
        margin-top: 0;
    }
    p{
        display: none;
    }
    a{
        font-size: 0.9rem;
        padding: 0.5rem 1.5rem;
        top: 19px;
    }
    img{
        bottom: 13px;
    }
}

    </style>
        
</head>
<body>
    <div class="msg">
        <h2> You Lose!</h2>
        <img src="../assets/animation.gif">
        <p> It's okay!</p>
        <a href="../index.html" >Play Again </a>
    </div>
</body>

</html>
