<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe| homepage</title>
    <link rel="stylesheet" href="style.css">
    <style >
        *{
            margin: 0;
            padding: 0;
        }

        body {
            background-image: url('assets/cloud.webp');
            background: ;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: rgba(205, 180, 219, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            box-sizing: border-box; 
            border: 6px solid #dc4d52; 
            border-radius: 5px;
            overflow: hidden;
        }
    
        .welcome-container {    
            padding: 3rem 4rem;
            border-radius: 1.5rem; 
            box-shadow: 0 0 2rem rgba(255, 175, 204, 0.4);
            text-align: center;
        }

        h2 {
            font-size: 2.5rem;
            font-family: "Pixel";
            letter-spacing: 0.7rem;
            word-spacing: 0.4rem;
            line-height: 3rem;
            color: #db585d;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

       @font-face {
        font-family: "Pixel";
        src: url("fonts/dogica/TTF/dogicapixel.ttf");
       }
       @font-face {
        font-family: "handwriting";
        src: url("fonts/Internet\ Friends.ttf");
       }
        .start-btn {
            display: inline-block;
            text-decoration: none;
            padding: 1rem 3rem;
            font-family: "handwriting";
            font-size: 1.1rem;
            font-weight: bold;
            color: #e56b6f;
            background-color: rgb(244, 217, 228); 
            padding: 0.8rem 5rem ;
            border: 3px solid #e56b6f;
            border-radius: 0.4rem;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin-top: 4rem;
        }

        /* Button par hover karne ka effect */
        .start-btn:hover {
            background-color: #ff758f;
            transform: scale(1.05); /* Thoda sa bada hoga click feel ke liye */
            box-shadow: 0 6px 15px rgba(255, 117, 143, 0.4);
        }
        p img{
            height: 4rem;
            width: 4rem;
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <h2>let's play</h2>
        <h2> tic-tac-toe</h2>
        <a href="home.html" class="start-btn">Start</a>
    </div>
    </style>
</head>
<body>
<section>
    <div>

    </div>
</section>


    
</body>
</html>
